name: Hello World Container

on:
  workflow_dispatch:
  push:

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  hello:
    runs-on: self-hosted
    container:
      image: node:24
    steps:
      - run: | 
          echo "START $(date -u +%H:%M:%S)"
          for i in $(seq 1 240); do
            printf '%s line-%04d\n' "$(date -u +%H:%M:%S)" "$i"
            sleep 0.5
          done
          echo "END $(date -u +%H:%M:%S)"
          exit 44
      - run: echo "this step should never run!"
      
